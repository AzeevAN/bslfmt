name: release

# Выпуск по тегу vX.Y.Z: сборка, проверка установки на трёх ОС, PyPI и
# GitHub Release. Ручной запуск (workflow_dispatch) — пробный: без публикации.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "тег $GITHUB_REF_NAME не совпадает с версией $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        installer: [pip, pipx, uv]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        if: matrix.installer == 'uv'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install with ${{ matrix.installer }}
        run: |
          wheel=$(ls dist/*.whl)
          case "${{ matrix.installer }}" in
            pip)  python -m pip install "$wheel" ;;
            pipx) python -m pip install pipx && python -m pipx install "$wheel"
                  python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH" ;;
            uv)   uv tool install "$wheel"
                  echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
                  uvx --from "$wheel" bslfmt --version ;;
          esac
      - name: CLI smoke
        run: python tests/cli_smoke.py

  publish-pypi:
    needs: install-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG
        run: |
          python - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else f"Версия {version}")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
