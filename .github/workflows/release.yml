name: release

# Выпуск по тегу vX.Y.Z: сборка, проверка установки на трёх ОС, PyPI и
# GitHub Release. Ручной запуск (workflow_dispatch) — пробный: сборка и
# проверка установки, без тестов (у tests.yml свой ручной запуск — лимит минут
# CI) и без публикации, даже если запущен на теге.
#
# Цепочка поставки: actions закреплены по SHA (комментарий — версия, обновления
# предлагает Dependabot), версии build и pipx — точные; хеши собранных файлов
# передаются из build в publish-pypi выходом задания и сверяются перед
# публикацией.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Полный набор тестов (Windows, macOS, Linux) — до публикации.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "тег $GITHUB_REF_NAME не совпадает с версией $version"; exit 1; }
      - name: Hashes of built files
        id: hashes
        run: echo "hashes=$(sha256sum dist/* | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  install-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        installer: [pip, pipx, uv]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: matrix.installer == 'uv'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Install with ${{ matrix.installer }}
        run: |
          wheel=$(ls dist/*.whl)
          case "${{ matrix.installer }}" in
            pip)  python -m pip install "$wheel" ;;
            pipx) python -m pip install pipx==1.17.9 && python -m pipx install "$wheel"
                  python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH" ;;
            uv)   uv tool install "$wheel"
                  echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
                  uvx --from "$wheel" bslfmt --version ;;
          esac
      - name: CLI smoke
        run: python tests/cli_smoke.py

  publish-pypi:
    needs: [build, tests, install-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Files match build hashes
        env:
          HASHES: ${{ needs.build.outputs.hashes }}
        run: echo "$HASHES" | base64 -d | sha256sum --check --strict
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG
        run: |
          python - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else f"Версия {version}")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
